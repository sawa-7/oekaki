<!DOCTYPE html> 
<html lang="en">
  
  <head>
    <meta charset="UTF-8" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>

  <body>
    <a-scene physics="driver: ammo" cursor="rayOrigin: mouse">
      <a-entity id="ctlR" laser-controls="hand: right" raycaster="showLine: false;"></a-entity>
      <a-entity id="ctlL" laser-controls="hand: left" raycaster="showLine: false;"></a-entity>

      <a-text id="txtR" value="RightColor:red" position="1 4 -3" color="red"></a-text>
      <a-text id="txtL" value="LeftColor:blue" position="-2 4 -3" color="blue"></a-text>

    </a-scene>


    
    <script>
      let ctlR = document.querySelector('#ctlR').object3D;
      let ctlL = document.querySelector('#ctlL').object3D;
      let posR = new THREE.Vector3();
      let posL = new THREE.Vector3();
      let isPressedR = false;
      let isPressedL = false;

      // 色
      let listR = ['red','blue','green','black'];
      let listL = ['red','blue','green','black'];
      Rcolor = 0;
      Lcolor = 1;


      // 描画する関数
      function updateLine(ctlId, pos, color) {
        let ctl = document.querySelector(`#${ctlId}`).object3D;
        pos.copy(ctl.position);

        let draw = document.createElement('a-sphere'); // 動的生成
        draw.setAttribute('radius', '0.03'); 
        draw.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`); 
        draw.setAttribute('color', color); 
                
        let scene = document.querySelector('a-scene');
        scene.appendChild(draw); // シーンに追加（表示）
        
      }


      setInterval(function() {
        if (isPressedR) {
          updateLine('ctlR', posR, listR[Rcolor]); // 右手で線を描画
        }
        if (isPressedL) {
          updateLine('ctlL', posL, listL[Lcolor]); // 左手で線を描画
        }

        // text変更
        txtR.setAttribute('value', 'RightColor:' + listR[Rcolor]);
        txtR.setAttribute('color', listR[Rcolor]);
        txtL.setAttribute('value', 'LeftColor:' + listL[Lcolor]);
        txtL.setAttribute('color', listL[Lcolor]);
      }, 0.01);


      $('#ctlR').on('triggerdown', function() { // 右手のトリガーDown
        isPressedR = true;
        // posR.copy(ctlR.position); // 線の引き始めを初期化
      });
      
      $('#ctlL').on('triggerdown', function() { // 左手のトリガーDown
        isPressedL = true;
        // posL.copy(ctlL.position); // 線の引き始めを初期化
      });
      
      $('#ctlR').on('triggerup', function() { // 右手のトリガーUp
        isPressedR = false;
      });
      
      $('#ctlL').on('triggerup', function() { // 左手のトリガーUp
        isPressedL = false;
      });


      $('#ctlR').on('thumbstickdown', function() { //右サムスティック
        Rcolor++;
        if(Rcolor >= listR.length){
          Rcolor = 0;
        }
      });

      $('#ctlL').on('thumbstickdown', function() { //左サムスティック
        Lcolor++;
        if(Lcolor >= listL.length){
          Lcolor = 0;
        }
      });
      
    </script>
  </body>
</html>
